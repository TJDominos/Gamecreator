    <script>
      (function() {
        if (typeof window === "undefined") return;
        function isBenignWalletError(msg) {
          if (!msg) return false;
          var s = String(msg).toLowerCase();
          return s.indexOf("failed to connect to metamask") !== -1 ||
                 s.indexOf("failed to connect to websocket") !== -1 ||
                 (s.indexOf("metamask") !== -1 && (s.indexOf("connect") !== -1 || s.indexOf("extension") !== -1 || s.indexOf("disconnected") !== -1));
        }

        var origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var combined = args.map(function(a) {
            return (a && a.message) || (typeof a === "object" ? (a.toString ? a.toString() : "") : String(a));
          }).join(" ");
          if (isBenignWalletError(combined)) {
            return;
          }
          origConsoleError.apply(console, args);
        };

        window.addEventListener("error", function(e) {
          if (isBenignWalletError(e.message) || (e.error && isBenignWalletError(e.error.message))) {
            e.preventDefault();
            e.stopImmediatePropagation && e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener("unhandledrejection", function(e) {
          var reason = e.reason;
          var msg = (reason && reason.message) || String(reason || "");
          if (isBenignWalletError(msg)) {
            e.preventDefault();
            e.stopImmediatePropagation && e.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>

  <style>
    .app-startup {
      min-height: 100vh;
      display: grid;
      place-items: center;
      align-content: center;
      gap: 14px;
      padding: 24px;
      box-sizing: border-box;
      color: #f8fafc;
      background: radial-gradient(circle at 50% 0%, #26364a 0%, #101820 52%, #090d12 100%);
      font-family: system-ui, sans-serif;
      text-align: center;
    }
    .app-startup__mark {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.32);
      border-radius: 50%;
      animation: app-startup-pulse 1.8s ease-in-out infinite;
    }
    .app-startup__mark span {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #f4b942;
      box-shadow: 0 0 20px rgba(244, 185, 66, 0.7);
    }
    .app-startup__bar {
      width: min(220px, 70vw);
      height: 3px;
      overflow: hidden;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.16);
    }
    .app-startup__bar span {
      display: block;
      width: 42%;
      height: 100%;
      border-radius: inherit;
      background: #f4b942;
      animation: app-startup-slide 1.4s ease-in-out infinite;
    }
    .app-startup p {
      margin: 0;
      color: rgba(248, 250, 252, 0.7);
      font-size: 13px;
    }
    .app-startup button {
      padding: 8px 16px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 6px;
      color: #f8fafc;
      background: rgba(255, 255, 255, 0.08);
      cursor: pointer;
    }
    @keyframes app-startup-slide {
      0% { transform: translateX(-120%); }
      50%, 100% { transform: translateX(300%); }
    }
    @keyframes app-startup-pulse {
      0%, 100% { transform: scale(0.94); opacity: 0.76; }
      50% { transform: scale(1.06); opacity: 1; }
    }
  </style>
</head>
  <body>
    <div id="root">
      <div class="app-startup" aria-live="polite">
        <div class="app-startup__mark" aria-hidden="true"><span></span></div>
        <strong>Randseed Creator</strong>
        <div class="app-startup__bar" role="progressbar" aria-label="Loading Randseed Creator"><span></span></div>
        <p id="app-startup-status">Preparing your workspace...</p>
        <button id="app-startup-retry" type="button" hidden>Reload</button>
      </div>
    </div>
    <script>
      window.setTimeout(function () {
        var status = document.getElementById("app-startup-status");
        var retry = document.getElementById("app-startup-retry");
        if (!status || !retry) return;
        status.textContent = "This is taking longer than expected.";
        retry.hidden = false;
        retry.onclick = function () { window.location.reload(); };
      }, 10000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
